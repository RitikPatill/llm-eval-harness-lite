[project]
name = "evalite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.3",
    "rich==13.7.1",
    "openai==1.35.3",
    "pydantic==2.7.4",
    "pyyaml==6.0.1",
]

[project.scripts]
evalite = "evalite.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
